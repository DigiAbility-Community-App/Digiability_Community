# ─────────────────────────────────────────────────────────────
# Digiability Community — Docker Compose
# Runs all infrastructure services (DB, cache, etc.)
# Usage:
#   docker-compose up -d          → start all
#   docker-compose down           → stop all
#   docker-compose logs -f        → tail logs
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — Primary Database ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: digiability_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiability_secret}
      POSTGRES_DB: ${POSTGRES_DB:-digiability_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - digiability_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiability} -d ${POSTGRES_DB:-digiability_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis — Caching / Pub-Sub ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: digiability_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - digiability_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin — PostgreSQL Web UI (dev only) ───────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: digiability_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@digiability.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev   # Only starts with: docker-compose --profile dev up

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: digiability_postgres_data
  redis_data:
    name: digiability_redis_data
  pgadmin_data:
    name: digiability_pgadmin_data

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────
networks:
  digiability_network:
    name: digiability_network
    driver: bridge
