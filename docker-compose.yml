# ─────────────────────────────────────────────────────────────
# Digiability Community — Docker Compose
# Runs all infrastructure services (DB, cache, etc.)
# Usage:
#   docker-compose up -d          → start all
#   docker-compose down           → stop all
#   docker-compose logs -f        → tail logs
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — Primary Database ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: digiability_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiability_secret}
      POSTGRES_DB: ${POSTGRES_DB:-digiability_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - digiability_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiability} -d ${POSTGRES_DB:-digiability_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis — Caching / Pub-Sub ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: digiability_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - digiability_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin — PostgreSQL Web UI (dev only) ───────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: digiability_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@digiability.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev   # Only starts with: docker-compose --profile dev up

  # ── user-svc — Auth & User Management API ──────────────────
  user-svc:
    build:
      context: ./services/user-svc
      dockerfile: Dockerfile
    container_name: digiability_user_svc
    restart: unless-stopped
    env_file:
      - ./services/user-svc/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digiability}:${POSTGRES_PASSWORD:-digiability_secret}@postgres:5432/${POSTGRES_DB:-digiability_db}?schema=public
    ports:
      - "${USER_SVC_PORT:-4001}:4001"
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── chat-svc — Realtime Chat API + WebSocket Gateway ────────
  chat-svc:
    build:
      context: ./services/chat-svc
      dockerfile: Dockerfile
    container_name: digiability_chat_svc
    restart: unless-stopped
    env_file:
      - ./services/chat-svc/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digiability}:${POSTGRES_PASSWORD:-digiability_secret}@postgres:5432/${POSTGRES_DB:-digiability_db}?schema=chat
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      SERVER_ID: chat-svc-docker-01
      CASSANDRA_HOST: cassandra
    ports:
      - "${CHAT_SVC_PORT:-4002}:4002"
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── chat-msg-worker — Message Persistence Consumer ──────────
  chat-msg-worker:
    build:
      context: ./services/chat-svc
      dockerfile: Dockerfile
    container_name: digiability_chat_msg_worker
    restart: unless-stopped
    command: ["node", "dist/workers/msg-svc.worker.js"]
    env_file:
      - ./services/chat-svc/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digiability}:${POSTGRES_PASSWORD:-digiability_secret}@postgres:5432/${POSTGRES_DB:-digiability_db}?schema=chat
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── chat-delivery-worker — Message Delivery Router ──────────
  chat-delivery-worker:
    build:
      context: ./services/chat-svc
      dockerfile: Dockerfile
    container_name: digiability_chat_delivery_worker
    restart: unless-stopped
    command: ["node", "dist/workers/delivery.worker.js"]
    env_file:
      - ./services/chat-svc/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digiability}:${POSTGRES_PASSWORD:-digiability_secret}@postgres:5432/${POSTGRES_DB:-digiability_db}?schema=chat
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    networks:
      - digiability_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── notif-svc — Push/Email Notification Worker ──────────────
  notif-svc:
    build:
      context: ./services/notif-svc
      dockerfile: Dockerfile
    container_name: digiability_notif_svc
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    networks:
      - digiability_network
    depends_on:
      redis:
        condition: service_healthy

  # ── Cassandra — Message Storage (Write-optimized) ────────────
  cassandra:
    image: cassandra:4.1
    container_name: digiability_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: digiability_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - digiability_network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: digiability_postgres_data
  redis_data:
    name: digiability_redis_data
  pgadmin_data:
    name: digiability_pgadmin_data
  cassandra_data:
    name: digiability_cassandra_data

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────
networks:
  digiability_network:
    name: digiability_network
    driver: bridge
